<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header('Productos')}"></head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>
<div class="container mt-4 mb-5">
    <div class="card shadow">
        <div class="card-header text-white" style="background:#2E7D32;">
            <div class="d-flex justify-content-between">
                <h3 class="mb-0"><i class="bi bi-box-seam"></i> Productos</h3>
                <a th:href="@{/productos/nuevo}" class="btn btn-light"><i class="bi bi-plus-circle"></i> Nuevo</a>
            </div>
        </div>
        <div class="card-body">
            <form method="get" th:action="@{/productos}" class="row mb-3 g-2">
                <div class="col-md-8"><input type="text" name="texto" th:value="${texto}" class="form-control" placeholder="Buscar producto..."></div>
                <div class="col-md-2"><button class="btn btn-primary w-100"><i class="bi bi-search"></i></button></div>
                <div class="col-md-2"><a th:href="@{/productos}" class="btn btn-secondary w-100">Limpiar</a></div>
            </form>
            <div class="table-responsive">
                <table class="table table-hover table-bordered align-middle">
                    <thead class="table-dark"><tr class="text-center">
                        <th>ID</th><th>Código</th><th>Nombre</th><th>Categoría</th>
                        <th>Precio</th><th>Stock</th><th>Estado</th><th>Acciones</th>
                    </tr></thead>
                    <tbody>
                        <tr th:each="p : ${productos}">
                            <td class="text-center" th:text="${p.idProducto}"></td>
                            <td th:text="${p.codigo}"></td>
                            <td th:text="${p.nombre}"></td>
                            <td><span class="badge bg-info" th:text="${p.categoria.nombre}"></span></td>
                            <td class="text-end" th:text="'S/. ' + ${#numbers.formatDecimal(p.precio,1,'POINT',2,'COMMA')}"></td>
                            <td class="text-center">
                                <span class="badge" th:classappend="${p.stock < 5 ? 'bg-danger' : 'bg-success'}" th:text="${p.stock}"></span>
                            </td>
                            <td class="text-center">
                                <span th:if="${p.estado}" class="badge bg-success">Activo</span>
                                <span th:unless="${p.estado}" class="badge bg-danger">Inactivo</span>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/productos/editar/{id}(id=${p.idProducto})}" class="btn btn-warning btn-sm"><i class="bi bi-pencil"></i></a>
                                <a href="#" class="btn btn-danger btn-sm" th:onclick="|confirmarEliminacion('@{/productos/eliminar/{id}(id=${p.idProducto})}')|"><i class="bi bi-trash"></i></a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(productos)}"><td colspan="8" class="text-center text-muted">No hay productos.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{layout/footer :: footer}"></div>
<div th:replace="~{layout/scripts :: scripts}"></div>
</body>
</html>
