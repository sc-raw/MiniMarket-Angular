<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header('Producto')}"></head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>
<div class="container mt-4 mb-5">
    <div class="card shadow">
        <div class="card-header text-white" style="background:#2E7D32;">
            <h3 class="mb-0"><i class="bi bi-box-seam"></i>
                <span th:if="${producto.idProducto == null}">Nuevo Producto</span>
                <span th:unless="${producto.idProducto == null}">Editar Producto</span>
            </h3>
        </div>
        <div class="card-body">
            <form th:action="@{/productos/guardar}" th:object="${producto}" method="post" onsubmit="return confirmarGuardar(this)">
                <input type="hidden" th:field="*{idProducto}">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">Código</label>
                        <input type="text" class="form-control" th:field="*{codigo}" required th:readonly="${producto.idProducto != null}">
                    </div>
                    <div class="col-md-8 mb-3">
                        <label class="form-label fw-bold">Nombre</label>
                        <input type="text" class="form-control" th:field="*{nombre}" required>
                    </div>
                    <div class="col-md-12 mb-3">
                        <label class="form-label fw-bold">Descripción</label>
                        <input type="text" class="form-control" th:field="*{descripcion}">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label fw-bold">Precio (S/.)</label>
                        <input type="number" step="0.01" min="0" class="form-control" th:field="*{precio}" required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label fw-bold">Stock</label>
                        <input type="number" min="0" class="form-control" th:field="*{stock}" required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label fw-bold">Categoría</label>
                        <select class="form-select" th:field="*{categoria}" required>
                            <option value="">Seleccione...</option>
                            <option th:each="c : ${categorias}" th:value="${c.idCategoria}" th:text="${c.nombre}"></option>
                        </select>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label fw-bold">Estado</label>
                        <select class="form-select" th:field="*{estado}">
                            <option th:value="true">Activo</option>
                            <option th:value="false">Inactivo</option>
                        </select>
                    </div>
                </div>
                <div class="text-end">
                    <button class="btn btn-success">Guardar</button>
                    <a th:href="@{/productos}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
<div th:replace="~{layout/footer :: footer}"></div>
<div th:replace="~{layout/scripts :: scripts}"></div>
</body>
</html>
