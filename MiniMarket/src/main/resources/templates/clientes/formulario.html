<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header('Cliente')}"></head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>
<div class="container mt-4 mb-5">
    <div class="card shadow">
        <div class="card-header text-white" style="background:#2E7D32;">
            <h3 class="mb-0"><i class="bi bi-person-vcard"></i>
                <span th:if="${cliente.id == null}">Nuevo Cliente</span>
                <span th:unless="${cliente.id == null}">Editar Cliente</span>
            </h3>
        </div>
        <div class="card-body">
            <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post" onsubmit="return confirmarGuardar(this)">
                <input type="hidden" th:field="*{id}">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">DNI</label>
                        <input type="text" class="form-control" th:field="*{dni}" maxlength="8" required th:readonly="${cliente.id != null}">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">Nombres</label>
                        <input type="text" class="form-control" th:field="*{nombres}" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">Apellidos</label>
                        <input type="text" class="form-control" th:field="*{apellidos}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Dirección</label>
                        <input class="form-control" th:field="*{direccion}">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label fw-bold">Teléfono</label>
                        <input class="form-control" th:field="*{telefono}">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label fw-bold">Correo</label>
                        <input type="email" class="form-control" th:field="*{correo}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Estado</label>
                        <select class="form-select" th:field="*{estado}">
                            <option th:value="true">Activo</option>
                            <option th:value="false">Inactivo</option>
                        </select>
                    </div>
                </div>
                <div class="text-end">
                    <button class="btn btn-success"><i class="bi bi-floppy"></i> Guardar</button>
                    <a th:href="@{/clientes}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
<div th:replace="~{layout/footer :: footer}"></div>
<div th:replace="~{layout/scripts :: scripts}"></div>
</body>
</html>
