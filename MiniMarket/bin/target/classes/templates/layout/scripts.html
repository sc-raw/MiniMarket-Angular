<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        function confirmarEliminacion(url){
            Swal.fire({
                title: '¿Eliminar registro?', text: 'Esta acción no podrá deshacerse.',
                icon: 'warning', showCancelButton: true,
                confirmButtonColor: '#dc3545', cancelButtonColor: '#6c757d',
                confirmButtonText: 'Sí, eliminar', cancelButtonText: 'Cancelar'
            }).then((result)=>{ if(result.isConfirmed){ window.location = url; } });
        }
        function confirmarGuardar(formulario){
            const campoId = formulario.querySelector("input[type='hidden']");
            let esNuevo = true;
            if(campoId && campoId.value !== "") esNuevo = false;
            Swal.fire({
                title: esNuevo ? '¿Registrar?' : '¿Actualizar?',
                text: esNuevo ? 'Se registrará un nuevo registro.' : 'Se actualizará la información.',
                icon: 'question', showCancelButton: true,
                confirmButtonColor: '#198754', cancelButtonColor: '#6c757d',
                confirmButtonText: 'Aceptar', cancelButtonText: 'Cancelar'
            }).then((result)=>{ if(result.isConfirmed) formulario.submit(); });
            return false;
        }
    </script>
</th:block>
</body>
</html>
