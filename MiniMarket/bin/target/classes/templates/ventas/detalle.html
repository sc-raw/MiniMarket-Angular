<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header('Detalle de Venta')}"></head>
<body>
<div th:replace="~{layout/navbar :: navbar}"></div>
<div class="container mt-4 mb-5">
    <div class="card shadow">
        <div class="card-header text-white" style="background:#2E7D32;">
            <h3 class="mb-0"><i class="bi bi-cart-data"></i> Venta #<span th:text="${venta.id}"></span></h3>
        </div>
        <div class="card-body">
            <div class="row mb-4">
                <div class="col-md-6">
                    <p><strong>Cliente:</strong> <span th:text="${venta.cliente.nombres + ' ' + venta.cliente.apellidos}"></span></p>
                    <p><strong>Cajero:</strong> <span th:text="${venta.cajero.nombres + ' ' + venta.cajero.apellidos}"></span></p>
                </div>
                <div class="col-md-6">
                    <p><strong>Fecha:</strong> <span th:text="${#temporals.format(venta.fechaRegistro,'yyyy-MM-dd HH:mm')}"></span></p>
                    <p><strong>Estado:</strong>
                        <span th:if="${venta.estado == 'PENDIENTE'}" class="badge bg-warning text-dark">PENDIENTE</span>
                        <span th:if="${venta.estado == 'EN_PROCESO'}" class="badge bg-info text-dark">EN PROCESO</span>
                        <span th:if="${venta.estado == 'FINALIZADA'}" class="badge bg-primary">FINALIZADA</span>
                        <span th:if="${venta.estado == 'CANCELADA'}" class="badge bg-danger">CANCELADA</span>
                    </p>
                </div>
            </div>
            <h5 class="fw-bold mb-3"><i class="bi bi-list-check"></i> Productos vendidos</h5>
            <div class="table-responsive">
                <table class="table table-bordered align-middle">
                    <thead class="table-dark"><tr class="text-center">
                        <th>Producto</th><th>Cantidad</th><th>Precio</th><th>Subtotal</th>
                    </tr></thead>
                    <tbody>
                        <tr th:each="d : ${detalles}">
                            <td th:text="${d.producto.nombre}"></td>
                            <td class="text-center" th:text="${d.cantidad}"></td>
                            <td class="text-end" th:text="'S/. ' + ${#numbers.formatDecimal(d.precio,1,'POINT',2,'COMMA')}"></td>
                            <td class="text-end fw-bold" th:text="'S/. ' + ${#numbers.formatDecimal(d.subtotal,1,'POINT',2,'COMMA')}"></td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr class="table-light">
                            <td colspan="3" class="text-end fw-bold">TOTAL:</td>
                            <td class="text-end fw-bold fs-5 text-success" th:text="'S/. ' + ${#numbers.formatDecimal(venta.total,1,'POINT',2,'COMMA')}"></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
            <div class="text-end">
                <a th:href="@{/ventas}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Regresar</a>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{layout/footer :: footer}"></div>
<div th:replace="~{layout/scripts :: scripts}"></div>
</body>
</html>
